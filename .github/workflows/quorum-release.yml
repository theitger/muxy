# muxy reads the files quorum writes (Sources/muxy/QuorumRun.swift). When
# quorum releases a version newer than the one muxy was last checked
# against (QuorumCompat.tested), this opens an issue to check muxy's
# quorum view against it, once per release.
name: quorum release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the version muxy was checked against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=$(sed -n 's/.*static let tested = "\(.*\)".*/\1/p' Sources/muxy/QuorumRun.swift)
          latest=$(gh release view -R yungweng/quorum --json tagName --jq .tagName | sed 's/^v//')
          echo "tested $tested, latest $latest"
          [ -n "$tested" ] && [ -n "$latest" ] || { echo "couldn't read a version"; exit 1; }
          newest=$(printf '%s\n%s\n' "$tested" "$latest" | sort -V | tail -1)
          if [ "$latest" = "$tested" ] || [ "$newest" = "$tested" ]; then exit 0; fi
          title="quorum $latest: check muxy's quorum view"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "issue exists"; exit 0
          fi
          gh issue create --title "$title" --body "quorum $latest is out; muxy was last checked against $tested.

          - Release notes: https://github.com/yungweng/quorum/releases/tag/v$latest
          - Open a finished babysit and a review in muxy's quorum view (Details) and compare with \`quorum status\`.
          - Then raise \`QuorumCompat.tested\` in \`Sources/muxy/QuorumRun.swift\` (and \`schemas\` if a file's schema changed)."
