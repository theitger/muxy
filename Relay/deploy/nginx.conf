# /etc/nginx/sites-available/<host> — replace muxy.example.com.
# certbot --nginx adds TLS and the HTTP → HTTPS redirect to this block.
server {
    listen 80;
    listen [::]:80;
    server_name muxy.example.com;

    root /var/www/muxy.example.com;
    # Room ids travel in the URL path — keep them out of the logs.
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # The phone app: one self-contained file.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src wss://muxy.example.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /relay/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
